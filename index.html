<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tierspiel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== GAME ===================== -->
<div id="game-screen">
  <div class="topbar">
    <div class="logo">Tierspiel</div>
    <div class="stat-pill" id="coins-display">0 Münzen</div>
    <div class="stat-pill" id="income-display">0/s</div>
    <div class="stat-pill" id="slots-display">0/0 Plätze belegt</div>
    <button id="reset-btn">🔄 Zurücksetzen</button>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="shop">🛒 Shop</button>
    <button class="tab-btn" data-tab="hatchery">🥚 Brüten</button>
    <button class="tab-btn" data-tab="pets">🐾 Tiere</button>
    <button class="tab-btn" data-tab="index">📖 Index</button>
  </div>

  <div id="panel-shop" class="tab-panel active">
    <div class="panel-header">
      <span>Eier zum Kaufen – für alle Spieler gleich</span>
      <span id="shop-rotation"></span>
    </div>
    <div id="shop-grid" class="grid"></div>
  </div>

  <div id="panel-hatchery" class="tab-panel">
    <div class="panel-header">
      <span>Deine brütenden Eier (läuft auch offline weiter)</span>
      <button id="hatch-all-btn" class="action-btn">🥚 Alle ausbrüten</button>
    </div>
    <div id="hatchery-grid" class="grid"></div>
  </div>

  <div id="panel-pets" class="tab-panel">
    <div class="panel-header">
      <span>Deine Tiere – ausgerüstete verdienen Geld/Sekunde</span>
      <button id="auto-equip-btn" class="action-btn">⚡ Bestes Ausrüsten</button>
    </div>
    <div id="inventory-grid" class="grid"></div>
  </div>

  <div id="panel-index" class="tab-panel">
    <div class="panel-header"><span>Alle Eier und Tiere – Unbekanntes wird erst nach dem Finden aufgedeckt</span></div>
    <h3 class="index-section-title">Eier</h3>
    <div id="index-eggs-grid" class="grid"></div>
    <h3 class="index-section-title">Tiere</h3>
    <div id="index-pets-grid" class="grid"></div>
  </div>
</div>

<div id="reveal-overlay" class="reveal-overlay hidden">
  <div class="reveal-rays"></div>
  <div class="reveal-card">
    <div id="reveal-art" class="reveal-art"></div>
    <div id="reveal-rarity" class="reveal-rarity"></div>
    <div id="reveal-name" class="reveal-name"></div>
    <div id="reveal-stats" class="reveal-stats"></div>
    <button id="reveal-close" class="primary-btn">Weiter</button>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="main.js"></script>
</body>
</html>
